<svg width="210" height="64" viewBox="0 0 210 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PROJTE">
  <!-- Símbolo: triplo chevron + terminus (Brand Identity PROJTE, Symbol Anatomy) -->
  <svg x="0" y="0" width="64" height="64" viewBox="0 0 88 88">
    <path d="M18 24 L30 44 L18 64" stroke="rgba(11,22,40,0.25)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M30 24 L42 44 L30 64" stroke="rgba(11,22,40,0.6)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M42 24 L54 44 L42 64" stroke="#0B1628" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="54" cy="44" r="4" fill="#1DB85A"/>
  </svg>
  <!-- Wordmark: "projt" navy + "e" lime (Forest, para contraste em fundo claro) -->
  <text x="72" y="43" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-weight="700" font-size="34" letter-spacing="-1" fill="#0B1628">projt<tspan fill="#1DB85A">e</tspan></text>
